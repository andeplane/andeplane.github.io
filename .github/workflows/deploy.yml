name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # Mixpanel project token (public by design; it ships in the bundle).
          # Set as a repository variable; when empty, tracking is disabled.
          VITE_MIXPANEL_TOKEN: ${{ vars.MIXPANEL_TOKEN }}
          VITE_MIXPANEL_API_HOST: ${{ vars.MIXPANEL_API_HOST }}

      # The Explore Titanic game at /explore-titanic/: built in its private repository
      # (dev/build-public.mjs there) and pushed to the explore-titanic-build branch as one
      # commit per release, then deployed by running this workflow (workflow_dispatch)
      - name: Add Explore Titanic
        run: |
          if git fetch --depth=1 origin explore-titanic-build; then
            mkdir -p dist/explore-titanic
            git archive FETCH_HEAD | tar -x -C dist/explore-titanic
            # files over GitHub's 100 MB limit are stored gzipped
            find dist/explore-titanic -name '*.gz' -exec gunzip {} +
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
