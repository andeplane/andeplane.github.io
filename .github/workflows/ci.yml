name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test content navigation
        run: node --experimental-strip-types --test tests/content/*.test.ts

      - name: Test neural operator numerics
        run: npm run test:neural-operators

      - name: Test route/shell coverage
        run: npm run test:seo

      - name: Test Gaussian quadrature numerics
        run: node --experimental-strip-types --test tests/gaussian-quadrature/*.test.ts

      - name: Test FNO sketch numerics
        run: npm run test:fno-sketch

      - name: Test quantum simulator engine
        run: npm ci --prefix packages/quantum && npm test --prefix packages/quantum

      # Same entry point the Pages deploy uses: builds every demo under
      # demos/ (each demo's own build script, including its test suite)
      # and then typechecks and builds the site itself.
      - name: Build site and all demos
        run: npm run build

      - name: Test recorder acoustics and playback
        run: npm test --prefix demos/flute-lab

      - name: Test AM receiver and electromagnetic field numerics
        run: npm test --prefix demos/am-radio
