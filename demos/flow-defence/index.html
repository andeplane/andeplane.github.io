<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌊</text></svg>" />
    <title>Flow Defence</title>
    <style>
      html, body { margin: 0; height: 100%; background: #05070d; overflow: hidden; }
      #stage { position: relative; width: 100%; height: 100%; }
      #gpu, #overlay { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
      #overlay { pointer-events: none; }
      #nogpu {
        display: none; color: #9fb4d0; font: 16px/1.6 system-ui, sans-serif;
        max-width: 32rem; margin: 20vh auto 0; text-align: center;
      }
      #errlog {
        position: absolute; top: 0; left: 0; z-index: 10; margin: 0; padding: 4px;
        color: #ff7b72; font: 10px/1.3 monospace; white-space: pre-wrap;
        pointer-events: none; max-height: 100%; overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <canvas id="gpu"></canvas>
      <canvas id="overlay"></canvas>
      <pre id="errlog"></pre>
    </div>
    <div id="nogpu">
      <h1>Flow Defence</h1>
      <p>This game needs WebGPU. Please use a recent Chrome, Edge, or Safari.</p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
