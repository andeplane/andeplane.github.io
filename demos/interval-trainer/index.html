<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="Ear training for musical intervals: hear the root and fifth together, then name the note that follows."
    />
    <meta name="theme-color" content="#05060c" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='4' fill='%23f5c274'/%3E%3Ccircle cx='16' cy='16' r='10' fill='none' stroke='%237fb2ff' stroke-width='1.5' opacity='.7'/%3E%3Ccircle cx='16' cy='16' r='15' fill='none' stroke='%237fb2ff' stroke-width='1' opacity='.35'/%3E%3C/svg%3E"
    />
    <title>Interval Trainer</title>
  </head>
  <body>
    <!-- The wave field: every note that sounds becomes a point source on this canvas. -->
    <canvas id="waves" aria-hidden="true"></canvas>
    <div id="vignette" aria-hidden="true"></div>
    <div id="grain" aria-hidden="true"></div>

    <div id="app">
      <header id="hud">
        <div class="hud-side">
          <span class="brand">Interval&nbsp;Trainer</span>
          <span class="chip" id="mode-chip">practice</span>
          <span class="chip chip--quiet" id="difficulty-chip">easy</span>
        </div>

        <div class="readouts" id="readouts">
          <div class="readout"><span class="micro">score</span><b id="score">0</b></div>
          <div class="readout"><span class="micro">streak</span><b id="streak">0</b></div>
          <div class="readout" id="time-readout">
            <span class="micro">time</span><b id="time">2:00</b>
          </div>
        </div>

        <div class="hud-side hud-side--end">
          <button class="icon-btn" id="help-btn" title="How to play" aria-label="How to play">
            ?
          </button>
          <button class="icon-btn" id="scores-btn" title="Highscores" aria-label="Highscores">
            ★
          </button>
          <button class="icon-btn" id="settings-btn" title="Settings" aria-label="Settings">
            ⚙
          </button>
        </div>
      </header>

      <div id="timebar" hidden><div id="timebar-fill"></div></div>

      <main id="stage">
        <p id="key-readout" class="micro">key of <b id="key-name">—</b></p>

        <div id="constellation" aria-hidden="true">
          <div class="note" id="note-root"><i class="dot"></i><span class="tag">1</span></div>
          <div class="note" id="note-fifth"><i class="dot"></i><span class="tag">5</span></div>
          <div class="note note--target" id="note-target">
            <i class="dot"></i><span class="tag">?</span>
          </div>
        </div>

        <div class="stage-actions">
          <button class="ghost-btn" id="replay">
            Play again <kbd>space</kbd>
          </button>
          <button class="ghost-btn ghost-btn--quiet" id="context-btn">
            Just 1+5
          </button>
        </div>

        <p id="prompt" role="status" aria-live="polite">&nbsp;</p>
      </main>

      <section id="keypad" aria-label="Answer keypad"></section>

      <section id="stats-strip" hidden aria-label="Accuracy by interval"></section>
    </div>

    <div id="overlay" hidden>
      <div id="overlay-card" role="dialog" aria-modal="true" tabindex="-1"></div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
