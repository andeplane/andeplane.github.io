<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" font-family="Inter, -apple-system, system-ui, sans-serif">
<defs>
  <marker id="tsBlue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0.5 0.8 L 9.5 5 L 0.5 9.2 L 3 5 z" fill="#3987e5"/></marker>
  <marker id="tsGreen" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0.5 0.8 L 9.5 5 L 0.5 9.2 L 3 5 z" fill="#2fbd8a"/></marker>
</defs>
<rect width="760" height="500" fill="#111111"/>

<text x="24" y="30" font-size="15" fill="#e8e8e8" font-weight="600">A rigid wall is not a boundary condition — it is faces set to zero</text>
<text x="24" y="50" font-size="12.5" fill="#9a9a9a">Pressure at cell centres, velocity on the faces between them. A hole is simply cells that aren't solid.</text>

<!-- solid wall run, split by the hole -->
<rect x="110" y="324" width="136" height="68" fill="#6d5c39" opacity="0.32"/>
<rect x="110" y="324" width="136" height="68" fill="none" stroke="#c9ae77" stroke-width="1.5" opacity="0.55"/>
<rect x="382" y="324" width="136" height="68" fill="#6d5c39" opacity="0.32"/>
<rect x="382" y="324" width="136" height="68" fill="none" stroke="#c9ae77" stroke-width="1.5" opacity="0.55"/>

<!-- grid -->
<line x1="110" y1="120" x2="518" y2="120" stroke="#232323" stroke-width="1"/>
<line x1="110" y1="188" x2="518" y2="188" stroke="#232323" stroke-width="1"/>
<line x1="110" y1="256" x2="518" y2="256" stroke="#232323" stroke-width="1"/>
<line x1="110" y1="324" x2="518" y2="324" stroke="#232323" stroke-width="1"/>
<line x1="110" y1="392" x2="518" y2="392" stroke="#232323" stroke-width="1"/>
<line x1="110" y1="120" x2="110" y2="392" stroke="#232323" stroke-width="1"/>
<line x1="178" y1="120" x2="178" y2="392" stroke="#232323" stroke-width="1"/>
<line x1="246" y1="120" x2="246" y2="392" stroke="#232323" stroke-width="1"/>
<line x1="314" y1="120" x2="314" y2="392" stroke="#232323" stroke-width="1"/>
<line x1="382" y1="120" x2="382" y2="392" stroke="#232323" stroke-width="1"/>
<line x1="450" y1="120" x2="450" y2="392" stroke="#232323" stroke-width="1"/>
<line x1="518" y1="120" x2="518" y2="392" stroke="#232323" stroke-width="1"/>

<!-- pressure samples at cell centres (air only) -->
<circle cx="144" cy="154" r="3.6" fill="#e8e8e8"/><circle cx="212" cy="154" r="3.6" fill="#e8e8e8"/><circle cx="280" cy="154" r="3.6" fill="#e8e8e8"/><circle cx="348" cy="154" r="3.6" fill="#e8e8e8"/><circle cx="416" cy="154" r="3.6" fill="#e8e8e8"/><circle cx="484" cy="154" r="3.6" fill="#e8e8e8"/>
<circle cx="144" cy="222" r="3.6" fill="#e8e8e8"/><circle cx="212" cy="222" r="3.6" fill="#e8e8e8"/><circle cx="280" cy="222" r="3.6" fill="#e8e8e8"/><circle cx="348" cy="222" r="3.6" fill="#e8e8e8"/><circle cx="416" cy="222" r="3.6" fill="#e8e8e8"/><circle cx="484" cy="222" r="3.6" fill="#e8e8e8"/>
<circle cx="144" cy="290" r="3.6" fill="#e8e8e8"/><circle cx="212" cy="290" r="3.6" fill="#e8e8e8"/><circle cx="280" cy="290" r="3.6" fill="#e8e8e8"/><circle cx="348" cy="290" r="3.6" fill="#e8e8e8"/><circle cx="416" cy="290" r="3.6" fill="#e8e8e8"/><circle cx="484" cy="290" r="3.6" fill="#e8e8e8"/>
<circle cx="280" cy="358" r="3.6" fill="#e8e8e8"/><circle cx="348" cy="358" r="3.6" fill="#e8e8e8"/>
<text x="144" y="145" font-size="11" fill="#8d8d8d" text-anchor="middle">p</text>

<!-- horizontal velocity on the vertical faces, mid-row -->
<line x1="168" y1="290" x2="188" y2="290" stroke="#3987e5" stroke-width="1.8" marker-end="url(#tsBlue)"/>
<line x1="236" y1="290" x2="256" y2="290" stroke="#3987e5" stroke-width="1.8" marker-end="url(#tsBlue)"/>
<line x1="304" y1="290" x2="324" y2="290" stroke="#3987e5" stroke-width="1.8" marker-end="url(#tsBlue)"/>
<line x1="372" y1="290" x2="392" y2="290" stroke="#3987e5" stroke-width="1.8" marker-end="url(#tsBlue)"/>
<line x1="440" y1="290" x2="460" y2="290" stroke="#3987e5" stroke-width="1.8" marker-end="url(#tsBlue)"/>
<text x="314" y="277" font-size="12" fill="#3987e5" text-anchor="middle">u<tspan font-size="8.5" dy="3">x</tspan></text>

<!-- vertical velocity on the horizontal faces above the wall row -->
<!-- over solid: zeroed -->
<g stroke="#7a3b3b" stroke-width="2.2" stroke-linecap="round">
  <line x1="138" y1="318" x2="150" y2="330"/><line x1="150" y1="318" x2="138" y2="330"/>
  <line x1="206" y1="318" x2="218" y2="330"/><line x1="218" y1="318" x2="206" y2="330"/>
  <line x1="410" y1="318" x2="422" y2="330"/><line x1="422" y1="318" x2="410" y2="330"/>
  <line x1="478" y1="318" x2="490" y2="330"/><line x1="490" y1="318" x2="478" y2="330"/>
  <line x1="240" y1="352" x2="252" y2="364"/><line x1="252" y1="352" x2="240" y2="364"/>
  <line x1="376" y1="352" x2="388" y2="364"/><line x1="388" y1="352" x2="376" y2="364"/>
</g>
<!-- over the gap: an ordinary face, and the air leaves through it -->
<line x1="280" y1="314" x2="280" y2="336" stroke="#2fbd8a" stroke-width="1.8" marker-end="url(#tsGreen)"/>
<line x1="348" y1="314" x2="348" y2="336" stroke="#2fbd8a" stroke-width="1.8" marker-end="url(#tsGreen)"/>
<line x1="280" y1="382" x2="280" y2="404" stroke="#2fbd8a" stroke-width="1.8" marker-end="url(#tsGreen)"/>
<line x1="348" y1="382" x2="348" y2="404" stroke="#2fbd8a" stroke-width="1.8" marker-end="url(#tsGreen)"/>
<text x="314" y="309" font-size="12" fill="#2fbd8a" text-anchor="middle">u<tspan font-size="8.5" dy="3">y</tspan></text>

<!-- callouts -->
<line x1="314" y1="430" x2="314" y2="412" stroke="#4a4a4a" stroke-width="1"/>
<text x="314" y="446" font-size="12" fill="#2fbd8a" text-anchor="middle">the hole: cells that simply aren't solid</text>
<text x="314" y="463" font-size="11.5" fill="#8d8d8d" text-anchor="middle">nothing here is special-cased — the same update runs</text>

<text x="176" y="352" font-size="12" fill="#a56a6a" text-anchor="middle">u = 0</text>
<text x="176" y="378" font-size="11.5" fill="#c9ae77" text-anchor="middle">solid</text>
<text x="452" y="352" font-size="12" fill="#a56a6a" text-anchor="middle">u = 0</text>
<text x="452" y="378" font-size="11.5" fill="#c9ae77" text-anchor="middle">solid</text>

<!-- the update itself -->
<text x="560" y="150" font-size="12.5" fill="#9a9a9a">Everywhere in the air:</text>
<text x="560" y="178" font-size="14" fill="#e8e8e8">∂p/∂t = −ρc² ∇·u</text>
<text x="560" y="202" font-size="14" fill="#e8e8e8">∂u/∂t = −(1/ρ) ∇p</text>
<text x="560" y="236" font-size="12" fill="#9a9a9a">Two lines, one leapfrog step,</text>
<text x="560" y="253" font-size="12" fill="#9a9a9a">no term that knows what a</text>
<text x="560" y="270" font-size="12" fill="#9a9a9a">hole or an end is.</text>

<circle cx="566" cy="316" r="3.6" fill="#e8e8e8"/>
<text x="580" y="320" font-size="11.5" fill="#8d8d8d">pressure, at the cell centre</text>
<line x1="558" y1="342" x2="574" y2="342" stroke="#3987e5" stroke-width="1.8" marker-end="url(#tsBlue)"/>
<text x="580" y="346" font-size="11.5" fill="#8d8d8d">velocity, on the face</text>
<g stroke="#7a3b3b" stroke-width="2.2" stroke-linecap="round"><line x1="560" y1="362" x2="572" y2="374"/><line x1="572" y1="362" x2="560" y2="374"/></g>
<text x="580" y="368" font-size="11.5" fill="#8d8d8d">face held at zero —</text>
<text x="580" y="384" font-size="11.5" fill="#8d8d8d">it touches a solid cell</text>
</svg>
