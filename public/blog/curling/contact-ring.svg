<text x="508" y="200" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="13" fill="#e8e8e8" text-anchor="start" font-weight="600">front of the band:</text>
<text x="508" y="220" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="12.5" fill="#9a9a9a" text-anchor="start" font-weight="400">rotation adds +x to the slip →</text>
<text x="508" y="237" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="12.5" fill="#9a9a9a" text-anchor="start" font-weight="400">friction points a little to the left</text>
<text x="508" y="282" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="13" fill="#e8e8e8" text-anchor="start" font-weight="600">back of the band:</text>
<text x="508" y="302" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="12.5" fill="#9a9a9a" text-anchor="start" font-weight="400">rotation subtracts −x →</text>
<text x="508" y="319" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="12.5" fill="#9a9a9a" text-anchor="start" font-weight="400">friction points a little to the right</text>
<text x="508" y="364" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="12.5" fill="#9a9a9a" text-anchor="start" font-weight="400">equal grip → the sideways parts</text>
<text x="508" y="381" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="12.5" fill="#9a9a9a" text-anchor="start" font-weight="400">cancel exactly. Curl needs a</text>
<text x="508" y="398" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="12.5" fill="#e8e8e8" text-anchor="start" font-weight="600">front–back asymmetry.</text>
</svg>