<text x="64" y="120" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="13.5" fill="#e8e8e8" text-anchor="start" font-weight="400"><tspan style="font-style:italic">t</tspan><tspan baseline-shift="sub" font-size="72%">ca</tspan> = <tspan style="font-style:italic;font-weight:700">L</tspan> · <tspan style="font-style:italic;font-weight:700">D</tspan></text>
